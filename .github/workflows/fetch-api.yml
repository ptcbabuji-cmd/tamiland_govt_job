name: Daily API fetch

on:
  schedule:
    - cron: "30 0 * * *"   # 00:30 UTC = 6:00 AM IST
  workflow_dispatch:        # run manually from the Actions tab

permissions:
  contents: write           # needed to push the commit

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch API response (with retry)
        env:
          API_KEY: ${{ secrets.API_KEY }}   # remove this line and the -H line below if no auth needed
        run: |
          mkdir -p data
          curl -sf \
            --retry 5 \
            --retry-delay 10 \
            --retry-all-errors \
            --connect-timeout 15 \
            --max-time 60 \
            -H "Authorization: Bearer $KEY_ONE_V" \
            "https://telegrambot-six-gules.vercel.app/api/today-summary?format=json&top=1" \
            -o /tmp/response.json
          jq . /tmp/response.json > data/response.json

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/response.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update API data $(date -u +%F)"
            git push
          fi

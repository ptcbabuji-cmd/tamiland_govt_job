name: Daily API fetch

on:
  schedule:
    - cron: "30 4 * * *"    # 10:00 AM IST
    - cron: "30 8 * * *"    # 2:00 PM IST
    - cron: "30 12 * * *"   # 6:00 PM IST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-api
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: KEY_ONE_VERCEL
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Fetch API response (with retry)
        env:
          API_TOKEN: ${{ secrets.KEY_ONE_V }}
          API_URL: ${{ secrets.API_URL }}
        run: |
          mkdir -p data

          if [ -z "$API_TOKEN" ]; then
            echo "Token secret is not set"
            exit 1
          fi

          if [ -z "$API_URL" ]; then
            echo "API_URL variable is not set"
            exit 1
          fi

          STATUS=$(curl -s \
            --retry 5 \
            --retry-delay 10 \
            --retry-all-errors \
            --connect-timeout 15 \
            --max-time 60 \
            -H "Authorization: Bearer $API_TOKEN" \
            "$API_URL" \
            -o /tmp/response.json \
            -w "%{http_code}")

          echo "HTTP status: $STATUS"

          if [ "$STATUS" -ne 200 ]; then
            echo "Response body:"
            head -c 500 /tmp/response.json
            exit 1
          fi

          TODAY=$(TZ=Asia/Kolkata date +%F)
          jq . /tmp/response.json > "data/$TODAY.json"
          cp "data/$TODAY.json" data/latest.json

      - name: Delete data older than 90 days
        run: |
          CUTOFF=$(TZ=Asia/Kolkata date -d "90 days ago" +%F)
          echo "Removing files older than $CUTOFF"
          for f in data/20??-??-??.json; do
            [ -e "$f" ] || continue
            d=$(basename "$f" .json)
            if [[ "$d" < "$CUTOFF" ]]; then
              echo "Deleting $f"
              rm "$f"
            fi
          done

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update API data $(TZ=Asia/Kolkata date '+%F %H:%M')"
            git push
          fi

name: Daily API fetch

on:
  schedule:
    - cron: "30 0 * * *"   # 00:30 UTC = 6:00 AM IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch API response (with retry)
        run: |
          mkdir -p data

          STATUS=$(curl -s \
            --retry 5 \
            --retry-delay 10 \
            --retry-all-errors \
            --connect-timeout 15 \
            --max-time 60 \
            -A "github-actions-fetch" \
            "https://telegrambot-six-gules.vercel.app/api/today-summary?format=json&top=1" \
            -o /tmp/response.json \
            -w "%{http_code}")

          echo "HTTP status: $STATUS"

          if [ "$STATUS" -ne 200 ]; then
            echo "Response body:"
            head -c 500 /tmp/response.json
            exit 1
          fi

          jq . /tmp/response.json > data/response.json

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/response.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update API data $(date -u +%F)"
            git push
          fi
